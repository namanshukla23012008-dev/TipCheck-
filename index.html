if(last.flags.length){var m=FM[lang](last.flags.length);h+='<h3>👪 '+t.fam+'</h3><div class="note" id="fmsg" style="margin-top:0">'+esc(m)+'</div><div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn ghost sm" id="fc">'+t.copy+'</button><a class="btn sm" style="text-decoration:none;display:inline-block" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(m)+'">WhatsApp</a><button class="btn ghost sm" id="rd">🔊 '+t.read+'</button></div>'}
return h+'<div class="note" style="margin-top:12px"><b>🚨 '+t.paid+'</b><br>'+t.paidt+' <a href="https://cybercrime.gov.in" target="_blank" rel="noopener" style="color:var(--red)">cybercrime.gov.in</a></div>'}
function wire(){if(!$("fc"))return;var m=$("fmsg").textContent;
$("fc").onclick=function(){try{navigator.clipboard.writeText(m);this.textContent="✓"}catch(e){}};
$("rd").onclick=function(){try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(m);u.lang=lang=="hi"?"hi-IN":"en-IN";speechSynthesis.speak(u)}catch(e){}}}
function setLang(l){lang=l;var t=T[l];document.documentElement.lang=l;
$("t_eye").textContent="● "+t.eye;$("t_h1a").textContent=t.h1a;$("t_h1b").textContent=t.h1b;$("t_sub").textContent=t.sub;$("c1").textContent=t.c1;$("c3").textContent=t.c3;$("c4").textContent=t.c4;
$("t_paste").textContent=t.paste;$("t_pastesub").textContent=t.pastesub;$("msg").placeholder=t.ph;$("t_nopii").textContent=t.nopii;$("go").textContent=t.go;$("t_priv").textContent="ⓘ "+t.priv;$("t_try").textContent="✎ "+t.tryx;$("t_edu").textContent=t.edu;
$("ex").innerHTML=t.ex.map(function(n,i){return'<button data-i="'+i+'">• '+n+'</button>'}).join("");
Array.prototype.forEach.call($("ex").children,function(b){b.onclick=function(){$("msg").value=EX[+b.dataset.i];upd();run()}});
if(last)last=analyze($("msg").value);render()}
function upd(){var n=$("msg").value.length;$("cnt").textContent=n+" / 1000";$("go").disabled=!$("msg").value.trim()}
function run(){last=analyze($("msg").value);render();if(window.innerWidth<760)$("out").scrollIntoView({behavior:"smooth"})}
$("msg").oninput=upd;$("go").onclick=run;$("lang").onchange=function(){setLang(this.value)};setLang("en");
</script></body></html>
